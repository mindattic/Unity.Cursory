# UC-T14: nightly end-to-end test. A dedicated server plays level 2 (Mass 2.0, needs two cursors) and two headless
# bot clients join it by code through the rendezvous service and solve it together, under Docker Compose. Since
# UM-T57 that job is Unity.Multiplayer's reusable game-smoke.yml (mp-host game smoke): bots A,B and scenario 2 come from
# mp-host.json, the strategy from CursoryBot. The PlayMode suite (including BotEndToEndTests, the same run in process)
# and the dotnet Core tests run beside it.
#
# Secrets:
#   UNITY_LICENSE           - required, the same Unity license file GameCI uses in Unity.Multiplayer's ci.yml.
#   MINDATTIC_REPOS_TOKEN   - a token that can read mindattic/Unity.Multiplayer, MindAttic.Capture, MindAttic.Components
#                             and Unity.Shared, if those repos are private (Packages/manifest.json takes them from
#                             file:../../); the workflow falls back to github.token.
#
# Packages/manifest.json resolves its file: packages two levels above Packages/, so every repo is checked out
# side by side inside the workspace (GameCI's container mounts only the workspace) and the project sits in
# Unity.Cursory/. Run it by hand with workflow_dispatch; `mp-host game smoke` does the compose part locally.
name: Nightly end-to-end

on:
  schedule:
    - cron: '0 10 * * *' # ~03:00 America/Los_Angeles, an hour after Unity.Multiplayer's smoke
  workflow_dispatch: {}

jobs:
  dotnet-tests:
    name: dotnet test (Core.Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Tests/Core.Tests --configuration Release

  playmode:
    name: Unity PlayMode (incl. BotEndToEndTests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Unity.Cursory
      - uses: actions/checkout@v4
        with:
          repository: mindattic/Unity.Multiplayer
          path: Unity.Multiplayer
          token: ${{ secrets.MINDATTIC_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: mindattic/MindAttic.Capture
          path: MindAttic.Capture
          token: ${{ secrets.MINDATTIC_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: mindattic/MindAttic.Components
          path: MindAttic.Components
          token: ${{ secrets.MINDATTIC_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: mindattic/Unity.Shared
          path: Unity.Shared
          token: ${{ secrets.MINDATTIC_REPOS_TOKEN || github.token }}

      - uses: actions/cache@v4
        with:
          path: Unity.Cursory/Library
          key: Library-Cursory-playmode-${{ hashFiles('Unity.Cursory/Packages/**', 'Unity.Multiplayer/unity/**') }}
          restore-keys: Library-Cursory-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: Unity.Cursory
          unityVersion: 6000.4.3f1
          testMode: playmode
          customParameters: -assemblyNames Unity.Cursory.PlayMode.Tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: ignore

  smoke:
    name: Docker Compose e2e (server + 2 bots solve L2)
    uses: mindattic/Unity.Multiplayer/.github/workflows/game-smoke.yml@main
    with:
      siblings: mindattic/MindAttic.Capture mindattic/MindAttic.Components mindattic/Unity.Shared
    secrets: inherit
